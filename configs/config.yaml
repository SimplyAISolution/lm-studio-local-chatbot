# LM Studio Local Chatbot Configuration

# API URL for LM Studio (default local server)
api_url: "http://localhost:1234"

# Model name to use (leave empty to select interactively)
# Example: "local-model" or "llama-2-7b-chat"
model_name: ""

# Temperature for response generation (0.0 = deterministic, 1.0 = creative)
temperature: 0.7

# Maximum tokens in response
max_tokens: 1000

# System prompt (optional)
system_prompt: "You are a helpful AI assistant running locally via LM Studio."

# Logging configuration
logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/chatbot.log"

# Chat settings
chat:
  save_history: true
  history_file: "logs/conversation_history.json"
  max_history_length: 50
